{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Appliances Heaven</title>
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/images/1.PNG' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="{% static 'assets/css/admin_login.css' %}">
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="icon"><img src="{% static 'assets/images/1.PNG' %}" style="width: 65%; height: 65%; object-fit: contain; filter: brightness(0) invert(1);"></div>
    <div class="brand-name">Appliances Heaven</div>
    <div class="brand-sub">Admin Console</div>
  </div>
  <div class="login-card">
    <h2>Welcome back 👋</h2>
    <p>Sign in with your administrator credentials</p>

    {% for msg in messages %}
    <div class="alert-error"><i class="fas fa-circle-exclamation"></i> {{ msg }}</div>
    {% endfor %}

    <form method="POST" action="{% url 'admin_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input class="form-input" type="text" name="username" id="username" placeholder="Enter admin username" required autocomplete="username"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-input" type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> &nbsp;Sign In to Admin Panel</button>
    </form>
  </div>
  <div class="back-link"><a href="{% url 'HomePage' %}"><i class="fas fa-arrow-left"></i> Back to Store</a></div>
</div>
</body>
</html>
